services:
  xmpp-rest:
    build:
      context: .
      dockerfile: Dockerfile
    image: xmpp-rest:1.0.12
    container_name: xmpp-rest
    restart: unless-stopped

    ports:
      - "8080:8080"

    env_file:
      - .env

    environment:
      REST_HOST: 0.0.0.0
      REST_PORT: 8080

    volumes:
      - ./data/logs:/app/logs
      - ./data/config:/app/config

    networks:
      - xmpp-net

networks:
  xmpp-net:
    driver: bridge